name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  buildmyhouse-client:
    name: buildmyhouse client (lint + tsc + vitest + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r assets/textures/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  buildmyhouse:
    name: buildmyhouse server (vitest sqlite + postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: localtestpw
          POSTGRES_DB: homely_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test (SQLite mode, default)
        run: npm test
      - name: Test (real Postgres)
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:localtestpw@localhost:5544/homely_test
