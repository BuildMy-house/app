name: Deploy observer-website to prod.stewardacs.xyz

on:
  push:
    branches: [main]
    paths:
      - 'observer-website/**'
      - '.github/workflows/deploy-observer-website.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observer-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: observer-website/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm run build

      - name: Build Docker image
        run: docker build -t observer-website:${{ github.sha }} .

      - name: Push to Docker registry
        if: ${{ secrets.DOCKER_REGISTRY_URL != '' }}
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin "${{ secrets.DOCKER_REGISTRY_URL }}"
          docker tag observer-website:${{ github.sha }} "${{ secrets.DOCKER_REGISTRY_URL }}/observer-website:${{ github.sha }}"
          docker tag observer-website:${{ github.sha }} "${{ secrets.DOCKER_REGISTRY_URL }}/observer-website:latest"
          docker push "${{ secrets.DOCKER_REGISTRY_URL }}/observer-website:${{ github.sha }}"
          docker push "${{ secrets.DOCKER_REGISTRY_URL }}/observer-website:latest"

      - name: Deploy via SSH to prod.stewardacs.xyz
        uses: appleboy/ssh-action@v1
        with:
          host: prod.stewardacs.xyz
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull "${{ secrets.DOCKER_REGISTRY_URL }}/observer-website:latest" || true
            docker stop observer-website || true
            docker rm observer-website || true
            docker run -d --name observer-website --restart unless-stopped -p 3000:3000 -e DATABASE_URL="${{ secrets.OBSERVER_DATABASE_URL }}" "${{ secrets.DOCKER_REGISTRY_URL }}/observer-website:latest"
