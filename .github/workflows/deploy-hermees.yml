name: Deploy hermees to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'hermees/**'
      - '.github/workflows/deploy-hermees.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermees
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hermees/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: hermees
          command: deploy
