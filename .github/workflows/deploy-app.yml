name: Deploy buildmyhouse app to app.buildmy.house

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r assets/textures/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_AXIOM_TOKEN: ${{ secrets.VITE_AXIOM_TOKEN }}
          VITE_AXIOM_DATASET: ${{ secrets.VITE_AXIOM_DATASET }}
          VITE_AXIOM_ENDPOINT: ${{ secrets.VITE_AXIOM_ENDPOINT }}

      - name: Warn about deployment cutover
        run: echo "::warning::Production uses a blue/green app cutover; the current app remains live until the candidate passes its runtime smoke test."

      - name: Deploy via SSH (build + run on host, joins steward_acs_default)
        uses: appleboy/ssh-action@v1
        with:
          host: 139.99.89.23
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            REPO_DIR=/home/ubuntu/buildmyhouse-app
            if [ ! -d "$REPO_DIR" ]; then
              git clone https://github.com/BuildMy-house/app.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            docker build -t buildmyhouse-app:latest .
            docker build -t buildmyhouse-mcp:latest -f mcp/Dockerfile .
            docker build -t buildmyhouse-luxcore:latest -f luxcore/Dockerfile .
            docker run --rm --entrypoint node buildmyhouse-app:latest \
              --input-type=module -e "import('/app/dist/server/src/render-queue.js')"
            docker volume create buildmyhouse-app-data >/dev/null
            docker volume create buildmyhouse-luxcore-assets >/dev/null

            CANDIDATE=buildmyhouse-app-candidate
            docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
            docker run -d --name "$CANDIDATE" \
              --network steward_acs_default \
              -e JWT_SECRET="${{ secrets.APP_JWT_SECRET }}" \
              -e DB_PATH=/data/homely.db \
              -e ASSET_DIR=/data/assets \
              -e STATIC_DIR=/app/dist-static \
              -e PORT=3000 \
              -e LUXCORE_WORKER_URL=http://buildmyhouse-luxcore:8081 \
              --env-file /home/ubuntu/buildmyhouse-mcp.env \
              -v buildmyhouse-app-data:/data \
              buildmyhouse-app:latest

            echo "Waiting for candidate app health..."
            healthy=0
            for attempt in $(seq 1 30); do
              if docker exec "$CANDIDATE" node --input-type=module -e "const r=await fetch('http://127.0.0.1:3000/healthz'); if (!r.ok) process.exit(1)"; then
                healthy=1
                break
              fi
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              echo "::error::Candidate app failed health check; preserving the current production container."
              docker logs "$CANDIDATE" || true
              docker rm -f "$CANDIDATE" || true
              exit 1
            fi

            if docker inspect buildmyhouse-app >/dev/null 2>&1; then
              docker rename buildmyhouse-app buildmyhouse-app-previous
            fi
            docker rename "$CANDIDATE" buildmyhouse-app
            docker update --restart unless-stopped buildmyhouse-app >/dev/null

            echo "Checking the public app after blue/green cutover..."
            if ! curl --fail --silent --show-error --retry 10 --retry-delay 2 https://app.buildmy.house/healthz >/dev/null; then
              echo "::error::Public health check failed after cutover; rolling back the app container."
              docker rm -f buildmyhouse-app || true
              if docker inspect buildmyhouse-app-previous >/dev/null 2>&1; then
                docker rename buildmyhouse-app-previous buildmyhouse-app
                docker update --restart unless-stopped buildmyhouse-app >/dev/null
              fi
              exit 1
            fi
            docker rm -f buildmyhouse-app-previous >/dev/null 2>&1 || true

            docker stop buildmyhouse-luxcore || true
            docker rm buildmyhouse-luxcore || true
            docker run -d --name buildmyhouse-luxcore \
              --network steward_acs_default \
              --restart unless-stopped \
              --env-file /home/ubuntu/buildmyhouse-mcp.env \
              -e PORT=8081 \
              -v buildmyhouse-luxcore-assets:/app/var/r2-assets \
              buildmyhouse-luxcore:latest

            docker stop buildmyhouse-mcp || true
            docker rm buildmyhouse-mcp || true
            test -s /home/ubuntu/buildmyhouse-mcp.env

            docker run -d --name buildmyhouse-mcp \
              --network steward_acs_default \
              --restart unless-stopped \
              -p 8080:8080 \
              -e HOMELY_MCP_HOST=0.0.0.0 \
              -e HOMELY_MCP_HTTP_PORT=8080 \
              -e BUILDMYHOUSE_MCP_RESOURCE_URL=https://app.buildmy.house/mcp \
              -e BUILDMYHOUSE_API_URL=http://buildmyhouse-app:3000 \
              --env-file /home/ubuntu/buildmyhouse-mcp.env \
              buildmyhouse-mcp:latest
