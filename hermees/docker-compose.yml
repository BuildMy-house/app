version: '3.8'

services:
  hermees:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermees-dev
    working_dir: /workspace/hermees
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace/hermees
      - /workspace/hermees/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    command: npm run dev
