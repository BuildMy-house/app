id: com.house-designer.homely
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: homely
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
modules:
  - name: homely
    buildsystem: simple
    sources:
      - type: dir
        path: ..
    build-commands:
      - cd homely
      - npm ci
      - npm run build
      - cd src-tauri
      - cargo build --release
      - install -Dm755 target/release/homely /app/bin/homely
      - install -Dm644 flatpak/com.house-designer.homely.desktop /app/share/applications/com.house-designer.homely.desktop
      - install -Dm644 flatpak/com.house-designer.homely.metainfo.xml /app/share/metainfo/com.house-designer.homely.metainfo.xml
      - install -Dm644 homely/src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.house-designer.homely.png
