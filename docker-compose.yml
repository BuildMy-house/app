services:
  bmh:
    build:
      context: .
      dockerfile: Dockerfile
    image: bmh:local
    container_name: bmh
    ports:
      - "${HOMELY_PORT:-3000}:3000"
    environment:
      # Required: no default is provided. Set it in a .env file or in your shell.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (e.g. in a .env file)}"
      INFISICAL_HOST_URL: "${INFISICAL_HOST_URL:-}"
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: "${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}"
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: "${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}"
      INFISICAL_PROJECT_ID: "${INFISICAL_PROJECT_ID:-}"
      INFISICAL_ENV: "${INFISICAL_ENV:-dev}"
      INFISICAL_SECRET_PATH: "${INFISICAL_SECRET_PATH:-/}"
      DB_PATH: /data/homely.db
      ASSET_DIR: /data/assets
      RENDER_DIR: /data/renders
      LUXCORE_WORKER_URL: http://bmh-renderer:8081
      LUXCORE_WORKER_TOKEN: "${LUXCORE_WORKER_TOKEN:?LUXCORE_WORKER_TOKEN must be set}"
      STATIC_DIR: /app/dist-static
      HOMELY_AUTOMATION_PORT: "${HOMELY_AUTOMATION_PORT:-9529}"
      PORT: "3000"
    volumes:
      - bmh-data:/data
    restart: unless-stopped

  bmh-renderer:
    build:
      context: .
      dockerfile: luxcore/Dockerfile
    image: bmh-renderer:local
    container_name: bmh-renderer
    environment:
      LUXCORE_WORKER_TOKEN: "${LUXCORE_WORKER_TOKEN:?LUXCORE_WORKER_TOKEN must be set}"
      LUXCORE_RENDER_ROOT: /data/renders
      PORT: "8081"
    volumes:
      - luxcore-renders:/data/renders
    restart: unless-stopped

volumes:
  bmh-data:
    name: app_homely-data
  luxcore-renders:
