[project]
name = "eq"
version = "0.1.0"
description = "Homely equivalence harness: differential testing of Sweet Home 3D vs the Homely clone"
requires-python = ">=3.12"
dependencies = [
    "websockets>=12",
    "pyyaml>=6",
    "pydantic>=2",
    "numpy>=1.26",
    "pillow>=10",
    "jsonschema>=4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
eq = "eq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eq"]

[tool.ruff]
line-length = 100
